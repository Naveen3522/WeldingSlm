<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in - Weld Assist</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/core/theme-init.js"></script>
  <link rel="stylesheet" href="/css/core/icons.css">
  <link rel="stylesheet" href="/css/core/tokens.css">
  <link rel="stylesheet" href="/css/core/base.css">
  <link rel="stylesheet" href="/css/components/form.css">
  <link rel="stylesheet" href="/css/components/notice.css">
  <link rel="stylesheet" href="/css/components/field-note.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
  <main class="auth">
    <form class="auth-card" id="authForm" novalidate>
      <div class="auth-brand"><span class="mark"><i class="ms" data-icon="bolt" aria-hidden="true">&#xea0b;</i></span><b>Weld Assist</b></div>
      <h1>Sign in</h1>
      <p class="auth-note" id="authNote" hidden></p>
      <label class="field"><span>Email</span><input id="authEmail" type="email" autocomplete="username" spellcheck="false"></label>
      <label class="field"><span>Password</span><input id="authPass" type="password" autocomplete="current-password" spellcheck="false"></label>
      <div class="auth-links"><a href="/forgot.html">Forgot password?</a></div>
      <div class="auth-error" id="authError" role="alert"></div>
      <div class="auth-actions">
        <button class="btn primary auth-submit" id="authSubmit" type="submit">Sign in</button>
      </div>
      <p class="auth-switch">New here? <a href="/signup.html">Create an account</a></p>
    </form>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
